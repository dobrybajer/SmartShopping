<!doctype html>
<html lang="pl" class="bg-background">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />

  <!-- PWA & Apple iOS Meta Tags -->
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Smart Shopping" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- SEO Meta Tags -->
  <title>Smart Shopping - Planowanie Posiłków & Wspólne Listy Zakupowe</title>
  <meta name="description"
    content="Inteligentna aplikacja do przeliczania makroskładników, skalowania posiłków i błyskawicznego odhaczania wspólnych zakupów w czasie rzeczywistym." />
  <!-- Anti-FOUC Theme Pre-Hydration Script -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('smartshopping_theme') || 'oled-black';
        var validThemes = ['oled-black', 'midnight-blue', 'forest-sage', 'warm-amber', 'cyberpunk-violet', 'clean-light'];
        if (validThemes.indexOf(savedTheme) === -1) {
          savedTheme = 'oled-black';
        }
        document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'oled-black');
      }
    })();
  </script>
</head>

<body class="bg-background text-foreground antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
