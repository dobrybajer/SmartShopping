<!doctype html>
<html lang="en" class="bg-background">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />

  <!-- PWA & Apple iOS Meta Tags -->
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Smart Shopping" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- SEO Meta Tags -->
  <title>Smart Shopping - Meal Planning & Shared Grocery Lists</title>
  <meta name="description"
    content="Smart household meal planning, macro tracking, and real-time synchronized grocery shopping." />
  <!-- Anti-FOUC Theme & Locale Pre-Hydration Script -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('smartshopping_theme') || 'oled-black';
        var validThemes = ['oled-black', 'midnight-blue', 'forest-sage', 'warm-amber', 'cyberpunk-violet', 'clean-light'];
        if (validThemes.indexOf(savedTheme) === -1) {
          savedTheme = 'oled-black';
        }
        document.documentElement.setAttribute('data-theme', savedTheme);

        var savedLang = localStorage.getItem('smartshopping_language') || (navigator.language && navigator.language.toLowerCase().startsWith('pl') ? 'pl' : 'en');
        document.documentElement.setAttribute('lang', savedLang);
        if (savedLang === 'pl') {
          document.title = 'Smart Shopping - Planowanie Posiłków & Wspólne Listy Zakupowe';
        } else {
          document.title = 'Smart Shopping - Meal Planning & Shared Grocery Lists';
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'oled-black');
      }
    })();
  </script>
</head>

<body class="bg-background text-foreground antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
